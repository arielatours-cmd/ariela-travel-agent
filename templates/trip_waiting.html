{% extends "base.html" %}
{% block title %}אריאלה מכינה את החופשה שלך{% endblock %}
{% block content %}
<section class="ariella-search-wait" dir="rtl">
  <div class="search-wait-card">
    <div class="travel-animation" aria-hidden="true">
      <div class="globe" role="img" aria-label="גלובוס צבעוני">🌍</div>
      <div class="flight-orbit"><span class="orbit-plane">✈</span></div>
    </div>
    <h1 id="stageTitle">מחפשת את הטיסות המתאימות לך…</h1>
    <p id="stageText">בודקת קודם את האפשרויות שכבר קיימות אצל אריאלה, ואם צריך ממשיכה לחיפוש חדש.</p>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="stage-row">
      <span class="stage active" data-stage="flight">טיסות</span>
      <span class="stage" data-stage="lodging">לינה</span>
      <span class="stage" data-stage="car">רכב</span>
      <span class="stage" data-stage="plan">מסלול</span>
    </div>
    <div class="search-dots"><i></i><i></i><i></i></div>
    <small>המסך מתעדכן בזמן שהחופשה שלך מתקדמת.</small>
  </div>
</section>
<style>
.ariella-search-wait{min-height:68vh;display:grid;place-items:center;padding:35px 18px;background:linear-gradient(180deg,#fffaf3,#f6eee2)}
.search-wait-card{text-align:center;max-width:620px;width:100%;background:#fff;border:1px solid #e2d4bd;border-radius:26px;padding:42px 26px;box-shadow:0 18px 50px rgba(69,52,26,.11)}
.travel-animation{height:155px;width:155px;margin:auto;position:relative;display:grid;place-items:center}.globe{width:92px;height:92px;display:grid;place-items:center;font-size:78px;line-height:1;border-radius:50%;position:relative;z-index:2;filter:drop-shadow(0 7px 12px rgba(31,53,75,.18));animation:globeFloat 2.8s ease-in-out infinite}.flight-orbit{position:absolute;inset:8px;border:1.5px dashed #d7b77b;border-radius:50%;animation:orbitFlight 5s linear infinite}.orbit-plane{position:absolute;top:-8px;left:50%;font-size:27px;line-height:1;color:#1f354b;transform:translateX(-50%) rotate(92deg);text-shadow:0 2px 5px rgba(31,53,75,.16)}
.search-wait-card h1{font-size:30px;margin:15px 0 9px}.search-wait-card p{color:#6d6459;font-size:17px;min-height:48px}.search-wait-card small{color:#887b6b}
.progress-track{height:8px;border-radius:99px;background:#eee6d9;overflow:hidden;margin:25px 0 14px}.progress-fill{height:100%;width:18%;background:#c99a3f;border-radius:99px;transition:width .6s ease}
.stage-row{display:flex;justify-content:space-between;gap:7px;font-size:13px;color:#a29a90}.stage{flex:1;padding:7px 3px;border-radius:20px;transition:.3s}.stage.active{color:#49391f;background:#f6ead4;font-weight:700}.stage.done{color:#5f765e}
.search-dots{display:flex;justify-content:center;gap:8px;margin:22px 0}.search-dots i{width:9px;height:9px;border-radius:50%;background:#c99a3f;animation:dot 1.2s infinite}.search-dots i:nth-child(2){animation-delay:.2s}.search-dots i:nth-child(3){animation-delay:.4s}
@keyframes globeFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes orbitFlight{to{transform:rotate(360deg)}}@keyframes dot{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1.2)}}
</style>
<script>
(function(){
 const url={{ url_for('site.trip_flight_status',trip_id=trip_id)|tojson }};
 const accountUrl={{ (url_for('site.account') ~ '#vacation-' ~ trip_id)|tojson }};
 const title=document.getElementById('stageTitle'), text=document.getElementById('stageText'), fill=document.getElementById('progressFill');
 const nodes=[...document.querySelectorAll('.stage')];
 const order=['flight','lodging','car','plan'];
 const copy={
   flight:['✈️','מחפשת את הטיסות המתאימות לך…','משווה אפשרויות ובודקת התאמה לתאריכים ולבקשה שלך.'],
   lodging:['🏨','ממשיכה ללינה…','פרטי הלינה שביקשת נשמרו עם החופשה.'],
   car:['🚗','ממשיכה לרכב…','פרטי הרכב שביקשת נשמרו עם החופשה.'],
   plan:['🗺️','מסדרת את המסלול והאטרקציות…','המסלול שאישרת נשמר כחלק מהחופשה.'],
   done:['✨','החופשה שלך מוכנה…','מעבירה אותך עכשיו לחופשות שלי.']
 };
 let tries=0;
 function paint(key,states){
   const x=copy[key]||copy.done;title.textContent=x[1];text.textContent=x[2];
   const idx=key==='done'?4:order.indexOf(key);fill.style.width=(18+Math.max(0,idx)*20)+'%';
   nodes.forEach((n,i)=>{const k=order[i],s=states&&states[k];n.classList.toggle('active',k===key);n.classList.toggle('done',s==='complete'||(idx>i&&s!=='skipped'));n.style.opacity=s==='skipped'?'.35':'1';if(s==='skipped')n.title='לא נדרש';});
 }
 function runApprovedStages(states,doneUrl){
   const remaining=order.slice(1).filter(k=>states[k]!=='skipped');
   let i=0;
   function next(){
     if(i>=remaining.length){paint('done',states);setTimeout(()=>location.replace(doneUrl||accountUrl),650);return;}
     const key=remaining[i++];paint(key,states);setTimeout(next,850);
   }
   next();
 }
 async function check(){
   tries++;
   try{
     const r=await fetch(url,{cache:'no-store'}),d=await r.json(),states=d.stages||{};
     paint('flight',states);
     if(d.status==='ready'){runApprovedStages(states,d.url);return;}
   }catch(e){}
   if(tries<90)setTimeout(check,2000);else location.replace(accountUrl);
 }
 paint('flight',{});setTimeout(check,900);
})();
</script>
{% endblock %}
