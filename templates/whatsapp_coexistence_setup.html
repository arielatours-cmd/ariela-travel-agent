<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>חיבור WhatsApp של אריאלה</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f7f7f7;margin:0;padding:32px;text-align:center;color:#222}
    .card{max-width:560px;margin:40px auto;background:#fff;border-radius:18px;padding:28px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
    button{background:#25D366;color:#fff;border:0;border-radius:12px;padding:16px 24px;font-size:18px;font-weight:700;cursor:pointer}
    #status{margin-top:18px;white-space:pre-wrap;direction:ltr;text-align:left;font-size:13px;background:#f3f3f3;padding:12px;border-radius:10px;display:none}
  </style>
</head>
<body>
<div class="card">
  <h1>חיבור WhatsApp של אריאלה</h1>
  <p>הכפתור פותח את תהליך החיבור הרשמי של Meta למספר הקיים ב‑WhatsApp Business.</p>
  <button id="connectBtn" type="button">חיבור WhatsApp Business</button>
  <div id="status"></div>
</div>
<script>
  const CONFIG_ID = '1767405781046590';
  const statusBox = document.getElementById('status');
  function showStatus(value){ statusBox.style.display='block'; statusBox.textContent=typeof value==='string'?value:JSON.stringify(value,null,2); }

  window.fbAsyncInit = function(){
    FB.init({appId:'{{ meta_app_id }}', cookie:true, xfbml:false, version:'v24.0'});
  };
  (function(d,s,id){
    var js,fjs=d.getElementsByTagName(s)[0]; if(d.getElementById(id)) return;
    js=d.createElement(s); js.id=id; js.src='https://connect.facebook.net/en_US/sdk.js'; fjs.parentNode.insertBefore(js,fjs);
  }(document,'script','facebook-jssdk'));

  window.addEventListener('message', function(event){
    if(event.origin!=='https://www.facebook.com' && event.origin!=='https://web.facebook.com') return;
    try{
      const data=typeof event.data==='string'?JSON.parse(event.data):event.data;
      if(data && data.type==='WA_EMBEDDED_SIGNUP') showStatus(data);
    }catch(e){}
  });

  document.getElementById('connectBtn').addEventListener('click', function(){
    if(!window.FB){ showStatus('Meta SDK is still loading. Try again in a moment.'); return; }
    FB.login(function(response){
      if(response.authResponse && response.authResponse.code){
        showStatus('Meta returned the onboarding code successfully.');
      }else if(response.status){
        showStatus(response);
      }
    },{
      config_id:CONFIG_ID,
      response_type:'code',
      override_default_response_type:true,
      extras:{
        setup:{},
        featureType:'whatsapp_business_app_onboarding',
        sessionInfoVersion:'3'
      }
    });
  });
</script>
</body>
</html>
