<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>חיבור WhatsApp של אריאלה</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f7f7f7;margin:0;padding:24px;text-align:center;color:#222}
    .card{max-width:620px;margin:30px auto;background:#fff;border-radius:18px;padding:28px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
    button{background:#25D366;color:#fff;border:0;border-radius:12px;padding:16px 24px;font-size:18px;font-weight:700;cursor:pointer}
    button:disabled{opacity:.55;cursor:default}
    #status{margin-top:18px;white-space:pre-wrap;direction:rtl;text-align:center;font-size:14px;background:#f3f3f3;padding:12px;border-radius:10px;display:none;overflow-wrap:anywhere}
  </style>
</head>
<body>
<div class="card">
  <h1>חיבור WhatsApp של אריאלה</h1>
  <p>הכפתור פותח את תהליך החיבור הרשמי של Meta למספר הקיים ב‑WhatsApp Business.</p>
  <button id="connectBtn" type="button">חיבור WhatsApp Business</button>
  <div id="status"></div>
</div>
<script>
  const APP_ID='{{ meta_app_id }}';
  const CONFIG_ID='4639464019658421';
  const REDIRECT_URI='{{ meta_redirect_uri }}';
  const statusBox=document.getElementById('status');
  const connectBtn=document.getElementById('connectBtn');
  let sessionInfo={},pendingCode=null,finishReceived=false,exchanged=false;

  function showStatus(v){statusBox.style.display='block';statusBox.textContent=v;}
  function safeSession(d){if(!d||typeof d!=='object')return {};return {waba_id:d.waba_id||null,phone_number_id:d.phone_number_id||null};}
  function safeMetaError(m){if(!m||typeof m!=='object')return '';const p=[];if(m.message)p.push('Meta: '+m.message);if(m.type)p.push('Type: '+m.type);if(m.code!=null)p.push('Code: '+m.code);if(m.error_subcode!=null)p.push('Subcode: '+m.error_subcode);return p.join('\n');}

  async function exchangeCode(code){
    if(exchanged||!code)return;
    exchanged=true;connectBtn.disabled=true;
    showStatus('Meta אישרה את החיבור. משלימה את ההגדרה מול WhatsApp...');
    try{
      const response=await fetch('/whatsapp-coexistence/exchange-code',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({code:code,session_info:safeSession(sessionInfo)})
      });
      const data=await response.json();
      if(data.ok){
        const phone=data.phone&&data.phone.display_phone_number?' ('+data.phone.display_phone_number+')':'';
        showStatus('החיבור הושלם בהצלחה ✅'+phone);
      }else{
        exchanged=false;connectBtn.disabled=false;
        const details=safeMetaError(data.meta);const http=data.http_status?'\nHTTP: '+data.http_status:'';
        showStatus('Meta החזירה שגיאה בהשלמת החיבור. לא ללחוץ שוב כרגע — שלחי לי צילום מסך.\n'+(data.error||'unknown_error')+http+(details?'\n\n'+details:''));
      }
    }catch(e){
      exchanged=false;connectBtn.disabled=false;
      showStatus('לא הצלחתי להשלים את החיבור מול השרת. לא ללחוץ שוב כרגע — שלחי לי צילום מסך.');
    }
  }

  function maybeExchange(){if(pendingCode&&!exchanged)exchangeCode(pendingCode);}

  window.addEventListener('message',function(event){
    if(event.origin===window.location.origin){
      const data=event.data;
      if(data&&data.type==='ARIELA_META_OAUTH_CALLBACK'){
        if(data.error){connectBtn.disabled=false;showStatus('Meta עצרה את תהליך החיבור.');return;}
        if(data.code){pendingCode=data.code;showStatus('Meta אישרה את ההתחברות. משלימה את החיבור...');setTimeout(maybeExchange,300);}
      }
      return;
    }
    if(event.origin!=='https://www.facebook.com'&&event.origin!=='https://web.facebook.com')return;
    try{
      const data=typeof event.data==='string'?JSON.parse(event.data):event.data;
      if(!data||data.type!=='WA_EMBEDDED_SIGNUP')return;
      if(data.data)sessionInfo=data.data;
      if(data.event==='FINISH_WHATSAPP_BUSINESS_APP_ONBOARDING'||data.event==='FINISH'){
        finishReceived=true;
        showStatus('WhatsApp אישרה את המספר. משלימה את החיבור...');
        maybeExchange();
      }else if(data.event==='CANCEL'){
        connectBtn.disabled=false;showStatus('תהליך החיבור בוטל.');
      }else if(data.event==='ERROR'){
        connectBtn.disabled=false;showStatus('Meta עצרה את תהליך החיבור. שלחי לי צילום מסך של המסך שהופיע.');
      }
    }catch(e){}
  });

  connectBtn.addEventListener('click',function(){
    connectBtn.disabled=true;
    showStatus('פותחת את תהליך החיבור של Meta...');
    const extras=JSON.stringify({setup:{},featureType:'whatsapp_business_app_onboarding',sessionInfoVersion:'3'});
    const params=new URLSearchParams({
      client_id:APP_ID,
      redirect_uri:REDIRECT_URI,
      response_type:'code',
      config_id:CONFIG_ID,
      extras:extras
    });
    const popup=window.open('https://www.facebook.com/v24.0/dialog/oauth?'+params.toString(),'arielaMetaSignup','width=720,height=800');
    if(!popup){connectBtn.disabled=false;showStatus('הדפדפן חסם את חלון Meta. אשרי פתיחת חלונות קופצים ונסי שוב.');}
  });
</script>
</body>
</html>
