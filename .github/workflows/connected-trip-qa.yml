name: Connected Trip QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python -m py_compile travel_agents.py scanner.py lodging_providers.py
      - name: JavaScript syntax
        run: node --check static/ariella-chat-confirmation-20260911.js
