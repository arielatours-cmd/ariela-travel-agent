name: Build Ariella 9.7.136
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, release/9.7.136]

jobs:
  qa-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile source
        run: python -m compileall -q .
      - name: JavaScript syntax
        run: node --check static/ariella-chat-confirmation-20260911.js
      - name: Import production app and materialize runtime QA patches
        env:
          SCHEDULER_ENABLED: 'false'
          DB_PATH: /tmp/ariella-v136-import.db
          SERPAPI_API_KEY: dummy-not-used-during-import
        run: python -c "import app; print('APP_IMPORT_OK')"
      - name: Verify current core markers
        run: |
          grep -q 'MONTHLY_SCAN_REUSE_HOURS' config.py
          grep -q 'monthly_scan_coverage' scanner.py
          grep -q 'db_only_open' scanner.py
          grep -q '_SERPAPI_HTTP_REQUESTS += 1' scanner.py
          grep -q 'def _queue_customer_scan' public_site.py
          grep -q 'open_db_only' public_site.py
          grep -q '/api/ariella/confirm-search' travel_agents.py
          grep -q 'ariella_travel_companions' travel_agents.py
          grep -q 'customer_gender' travel_agents.py
          grep -q 'ariellaRegistrationGender' templates/join.html
      - name: Tests if present
        env:
          SCHEDULER_ENABLED: 'false'
          DB_PATH: /tmp/ariella-v136-test.db
          SERPAPI_API_KEY: dummy-not-used-by-unit-tests
        run: |
          set +e
          pytest -q
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 5 ]; then
            exit "$code"
          fi
          if [ "$code" -eq 5 ]; then
            echo "No pytest tests are present; compile/import validation passed."
          fi
      - name: Package full source
        run: |
          rm -rf .git .pytest_cache
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          rm -f data/*.db data/*.db-shm data/*.db-wal
          zip -r ariella_v9_7_136_full.zip . -x '*.pyc' '.git/*' '.pytest_cache/*' 'ariella_v9_7_136_full.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: ariella_v9_7_136_full
          path: ariella_v9_7_136_full.zip
