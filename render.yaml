services:
  - type: web
    name: ariela-travel-agent-v6
    runtime: python
    buildCommand: python tools/apply_v136.py && python tools/fix_admin_scan_filter.py && python tools/fix_scanner_adults.py && python tools/fix_admin_offer_fields.py && python tools/personal_trip_booking_id_v136.py && python tools/personal_offer_dedup_v136.py && python tools/personal_booking_context_v136.py && python tools/booking_target_resolver_v136.py && python tools/mobile_ux_batch_20260904.py && python tools/business_class_and_party_20260904.py && python tools/mobile_header_hotfix_20260904.py && python tools/mobile_final_review_20260904.py && python tools/lower_mobile_hamburger_20260904.py && python tools/mobile_deals_filters_compact_20260904.py && python tools/mobile_login_fit_20260904.py && python tools/login_error_modal_20260904.py && python -m compileall -q scanner.py public_site.py admin.py database.py booker.py && pip install -r requirements.txt
    # One worker is intentional because the in-process scheduler must run only once.
    startCommand: gunicorn --workers 1 --threads 4 app:app
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: ariella-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: MAX_SEARCHES_PER_SCAN
        value: "8"
      - key: MIN_DEAL_SCORE
        value: "70"
      - key: MAX_DAILY_DEALS
        value: "5"
      - key: DAILY_SEND_HOUR
        value: "17"
      - key: DAILY_SEND_MINUTE
        value: "0"
      - key: WIDE_SCAN_HOUR
        value: "6"
      - key: WIDE_SCAN_MINUTE
        value: "15"
      - key: DB_PATH
        value: /var/data/ariella.db


# WhatsApp values must be added securely in the Render dashboard:
# WHATSAPP_ACCESS_TOKEN
# WHATSAPP_PHONE_NUMBER_ID
# WHATSAPP_RECIPIENT
# Optional: WHATSAPP_API_VERSION

# Public website login sessions:
# FLASK_SECRET_KEY (use a long random secret in Render)