services:
  - type: web
    name: ariela-travel-agent-v6
    runtime: python
    buildCommand: python -m compileall -q scanner.py public_site.py admin.py database.py booker.py && pip install -r requirements.txt
    # Source migrations are materialized in the repository. Re-running historical
    # patch scripts here caused non-idempotent UI regressions between deployments.
    # One worker is intentional because the in-process scheduler must run only once.
    # --timeout raises gunicorn's default 30s worker kill: a chat turn that makes
    # Tinkerbell generate a long reply (an itinerary/route recommendation, close
    # to its max output length) routinely takes longer than that. Without this,
    # gunicorn kills the request mid-flight and the customer's chat just hangs
    # forever with no error ever reaching the browser ("the conversation got stuck").
    # Threads raised 4->12 on 2026-10-12, then rolled straight back here: within
    # ~10 minutes of that deploy the live instance was crash-looping (/health's
    # deployed_at changing every few minutes on the same commit, 502s mid-chat)
    # - almost certainly each of the 12 threads holding a full request's memory
    # (conversation history, cached system prompt, in-flight Anthropic response)
    # at once pushed the instance over its memory limit and got OOM-killed,
    # repeatedly. 4 is the known-stable value; raising it again needs a plan
    # upgrade with more memory first, confirmed in Render's own metrics/logs
    # ("Worker exited"/"out of memory"/"SIGKILL"), not just picked by feel.
    # The retry-on-429/529 added to _post_claude (ariella_chat_clean.py) at the
    # same time stands regardless - it helps even at 4 threads.
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 app:app
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: ariella-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: MAX_SEARCHES_PER_SCAN
        value: "8"
      - key: MIN_DEAL_SCORE
        value: "70"
      - key: MAX_DAILY_DEALS
        value: "5"
      - key: DAILY_SEND_HOUR
        value: "17"
      - key: DAILY_SEND_MINUTE
        value: "0"
      - key: WIDE_SCAN_HOUR
        value: "6"
      - key: WIDE_SCAN_MINUTE
        value: "15"
      - key: DB_PATH
        value: /var/data/ariella.db


# WhatsApp values must be added securely in the Render dashboard:
# WHATSAPP_ACCESS_TOKEN
# WHATSAPP_PHONE_NUMBER_ID
# WHATSAPP_RECIPIENT
# Optional: WHATSAPP_API_VERSION

# Public website login sessions:
# FLASK_SECRET_KEY (use a long random secret in Render)
