<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>חיבור WhatsApp של אריאלה</title><style>body{font-family:Arial,sans-serif;background:#f7f7f7;margin:0;padding:24px;text-align:center;color:#222}.card{max-width:560px;margin:40px auto;background:#fff;border-radius:18px;padding:28px;box-shadow:0 6px 24px #0001}input,button{box-sizing:border-box;width:100%;padding:14px;margin-top:12px;border-radius:10px;font-size:17px}input{border:1px solid #ccc;direction:ltr}button{background:#25D366;color:white;border:0;font-weight:700}#status{margin-top:16px;white-space:pre-wrap;direction:ltr;text-align:left;font-size:13px}</style></head><body><div class="card"><h1>חיבור WhatsApp של אריאלה</h1><p>הזיני פעם אחת את Meta App ID של ARIELA TOURS ולחצי על החיבור.</p><input id="appId" inputmode="numeric" placeholder="Meta App ID"><button id="connect" type="button">חיבור WhatsApp Business</button><div id="status"></div></div><script>const CONFIG_ID='1767405781046590';const s=document.getElementById('status');let initialized=false;function msg(x){s.textContent=typeof x==='string'?x:JSON.stringify(x,null,2)}function loadMeta(appId){return new Promise((resolve,reject)=>{window.fbAsyncInit=()=>{FB.init({appId:appId,cookie:true,xfbml:false,version:'v24.0'});initialized=true;resolve()};if(window.FB){window.fbAsyncInit();return}const js=document.createElement('script');js.src='https://connect.facebook.net/en_US/sdk.js';js.async=true;js.defer=true;js.onerror=reject;document.head.appendChild(js)})}window.addEventListener('message',e=>{if(e.origin!=='https://www.facebook.com'&&e.origin!=='https://web.facebook.com')return;try{const d=typeof e.data==='string'?JSON.parse(e.data):e.data;if(d&&d.type==='WA_EMBEDDED_SIGNUP')msg(d)}catch(_){}});document.getElementById('connect').onclick=async()=>{const appId=document.getElementById('appId').value.trim();if(!/^\d+$/.test(appId)){msg('יש להזין Meta App ID מספרי.');return}try{if(!initialized)await loadMeta(appId);FB.login(r=>{if(r.authResponse&&r.authResponse.code)msg('Meta returned the onboarding code successfully.');else msg(r)},{config_id:CONFIG_ID,response_type:'code',override_default_response_type:true,extras:{setup:{},featureType:'whatsapp_business_app_onboarding',sessionInfoVersion:'3'}})}catch(e){msg('Meta SDK failed to load: '+e)}};</script></body></html>
