<section class="feedback-section">
<div class="feedback-card">
<h2>חושבים שחסר משהו?</h2>
<p>נשמח לשמוע על רעיונות, הצעות לשיפור או כל דבר שלדעתכם יהפוך את <strong>אריאלה</strong> לשימושית יותר.</p>
<form method="post" action="/feedback">
<input type="text" name="name" placeholder="שם מלא" required>
<input type="email" name="email" placeholder="כתובת אימייל" required>
<input type="tel" name="phone" placeholder="טלפון" required>
<textarea name="message" rows="7" placeholder="כתבו כאן את ההערה, ההצעה או הרעיון שלכם..." required></textarea>
<button type="submit">שלחו לנו את הרעיון</button>
</form>
<p class="feedback-success" style="display:none;">תודה! קיבלנו את ההצעה שלכם. כל רעיון נקרא ועוזר לנו להמשיך לשפר את אריאלה.</p>
</div>
</section>
